general {
    lock_cmd = pidof hyprlock || hyprlock       # Запуск блокировки
    before_sleep_cmd = loginctl lock-session    # Блокировка перед сном
    after_sleep_cmd = hyprctl dispatch dpms on  # Включение экрана после сна
}

listener {
    timeout = 300                                 # 5 минут
    on-timeout = brightnessctl -s set 10         # Затемнить экран
    on-resume = brightnessctl -r                 # Вернуть яркость
}

listener {
    timeout = 600                                 # 10 минут
    on-timeout = loginctl lock-session           # Заблокировать экран
}

listener {
    timeout = 900                                 # 15 минут
    on-timeout = hyprctl dispatch dpms off       # Выключить мониторы
    on-resume = hyprctl dispatch dpms on         # Включить мониторы
}
